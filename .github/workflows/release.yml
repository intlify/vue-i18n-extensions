name: Release

# Triggers:
#   - tag push (v*): publish to npm, then create the GitHub Release once it
#     succeeds.
#   - workflow_dispatch: recover an existing tag by running one job
#     (npm-publish / release-notes) or both. A version that is already
#     published is skipped, so `all` is safe to re-run. To publish a version
#     that is not on npm yet, start the run from the tag ("Use workflow from"),
#     so that the provenance points at the tagged commit.
#
# CHANGELOG.md is already part of the tagged release commit made by
# `pnpm release` (see bump.config.ts). This workflow never writes or commits files.
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - npm-publish
          - release-notes
      tag:
        description: Existing tag to release (e.g. v9.0.1 or v10.0.0-beta.0)
        type: string
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions: {}

jobs:
  npm-publish:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'npm-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publisher (OIDC)

    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Resolve dist-tag from tag
        id: meta
        # A prerelease goes to its first identifier (`beta` for v10.0.0-beta.0), or to
        # `next` when that starts with a digit, since npm rejects a dist-tag that looks
        # like a semver range. Only a stable release moves `latest`.
        run: |
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z][0-9A-Za-z-]*) ]]; then
            echo "dist_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Setup node.js
        # pnpm 11 and later publish without the npm CLI, so npm only checks
        # whether the version is already published (`npm view`). setup-node
        # caches automatically only for npm, but keep the cache off explicitly
        # in a release job (zizmor: cache-poisoning).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check the tag against package.json
        # The publish step skips a version that is already on npm. Without this
        # check, a hand-made tag on a commit that did not bump the version would
        # pass there and get a GitHub Release for a version that was never published.
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::$TAG does not match the version in package.json ($version)"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        # Under OIDC trusted publishing, pnpm attaches provenance on its own, so
        # no token or provenance setting is needed. `--no-git-checks`: the tag
        # checkout is a detached HEAD, and pnpm publishes only from master/main
        # by default.
        # Skip a version that is already on npm, so that a retry is idempotent.
        # npm does not serve a new version until its malware scan ends, so do not
        # retry this job right after a publish.
        # The provenance records the ref that started the run. A run started
        # from a branch would attest the head of that branch instead of the
        # tagged commit, so only a run started from the tag publishes.
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@intlify/vue-i18n-extensions@$version" version > /dev/null 2>&1; then
            echo "↺ @intlify/vue-i18n-extensions@$version is already on npm, skipping"
          elif [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo "::error::Start this workflow from the tag $TAG (Use workflow from) to publish it"
            exit 1
          else
            pnpm publish --access public --no-git-checks --tag "$DIST_TAG"
          fi
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}

  release-notes:
    needs:
      - npm-publish
    if: >-
      always() && (
        (github.event_name == 'push' &&
          needs.npm-publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release-notes') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'all' &&
          needs.npm-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release

    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Create GitHub Release (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            FLAGS=(--verify-tag --generate-notes)
            # SemVer prerelease: '-' right after major.minor.patch, not build metadata
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
